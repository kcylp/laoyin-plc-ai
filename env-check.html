<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>环境检查 - 老殷工控PLC</title>
    <style>
        .env-page { max-width: 960px; margin: 0 auto; padding: 30px 20px; width: 100%; box-sizing: border-box; overflow-y: auto; }
        .env-toolbar { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 18px; }
        .env-score { display: grid; gap: 4px; }
        .env-score .num { font-size: 2.4rem; line-height: 1; font-weight: 800; color: var(--tia-titlebar); }
        .env-score .summary { color: #555; font-size: .95rem; }
        .env-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .env-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 12px; }
        .env-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px 18px; display: grid; gap: 8px; min-height: 128px; }
        .env-card .topline { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
        .env-card .label { font-weight: 700; color: #222; }
        .env-card .state { font-weight: 800; font-size: .9rem; white-space: nowrap; }
        .env-card .val, .env-card .expected { font-size: .86rem; color: #666; overflow-wrap: anywhere; }
        .env-card .desc { font-size: .9rem; color: #333; line-height: 1.55; }
        .env-card .advice { font-size: .86rem; color: #4b5563; line-height: 1.55; background: #fafbfc; border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px 10px; }
        .env-card .fix-btn { justify-self: start; padding: 7px 12px; font-size: .85rem; }
        .state.ok { color: var(--tia-ok); }
        .state.warn { color: #d97706; }
        .state.fail { color: #dc2626; }
        .state.unknown { color: #6b7280; }
        .hint { background: #fafbfc; border: 1px solid #e0e0e0; border-radius: 8px; padding: 14px 16px; margin: 16px 0; font-size: .9rem; color: #444; line-height: 1.7; overflow-wrap: anywhere; }
        .hint code { background: #eef; padding: 2px 6px; border-radius: 4px; font-size: .85em; }
        .btn-primary { background: var(--tia-accent); color:#fff; border:1px solid var(--tia-accent); padding:10px 18px; border-radius:8px; cursor:pointer; font-size:.95rem; }
        .btn-primary:hover { background: var(--tia-accent-2); }
        .btn-ghost { background:#fff; color:var(--tia-accent-2); border:1px solid var(--tia-accent-line); padding:10px 18px; border-radius:8px; cursor:pointer; font-size:.95rem; text-decoration:none; display:inline-block; }
        .btn-ghost:hover { background: var(--tia-accent-soft); border-color: var(--tia-accent); }
        .loading { color:#666; text-align:center; padding:40px; }
    </style>
    <link rel="stylesheet" href="operations.css">
</head>
<body class="env-console tia-portal-shell">
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="header-text">
                    <h1>环境检查</h1>
                    <p>一键确认本机能否运行老殷工控PLC、博途 Openness 与博途在线引擎</p>
                </div>
                <div class="user-actions"><button id="logoutBtn" class="logout-btn">退出登录</button></div>
            </div>
        </header>

        <main class="env-page">
            <section class="env-toolbar">
                <div class="env-score" aria-live="polite">
                    <div class="num"><span id="healthScore">--</span><small> 分</small></div>
                    <div class="summary" id="summary">等待检查</div>
                </div>
                <div class="env-actions">
                    <button class="btn-primary" id="refreshBtn" type="button">重新检查</button>
                    <button class="btn-ghost" id="deepBtn" type="button">深度诊断</button>
                    <button class="btn-ghost" id="exportBtn" type="button">导出诊断包</button>
                    <a class="btn-ghost" href="settings.html">AI 供应商</a>
                    <button class="btn-primary" onclick="location.href='index.html'" type="button">进入主界面</button>
                </div>
            </section>

            <div id="loading" class="loading">正在检查...</div>
            <div id="hint" class="hint" style="display:none;"></div>
            <section id="items" class="env-grid" aria-live="polite"></section>
        </main>
    </div>

    <script>
    const token = localStorage.getItem('token');
    if (!token) location.href = 'login.html';
    const headers = () => ({ 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' });
    document.getElementById('logoutBtn').onclick = () => { localStorage.clear(); location.href='login.html'; };

    const statusLabel = { ok: '正常', warn: '需处理', fail: '失败', unknown: '待确认' };
    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }
    function setBusy(text) {
        document.getElementById('loading').style.display = '';
        document.getElementById('loading').textContent = text;
    }
    function clearBusy() {
        document.getElementById('loading').style.display = 'none';
    }
    function render(result) {
        clearBusy();
        document.getElementById('healthScore').textContent = result.healthScore ?? '--';
        document.getElementById('summary').textContent = result.summary || '未返回诊断摘要';
        const items = Array.isArray(result.items) ? result.items : [];
        document.getElementById('items').innerHTML = items.map(row => `
            <article class="env-card">
                <div class="topline">
                    <div class="label">${escapeHtml(row.名称)}</div>
                    <div class="state ${escapeHtml(row.状态)}">${escapeHtml(statusLabel[row.状态] || row.状态)}</div>
                </div>
                <div class="val">实测：${escapeHtml(row.实测值 || '未返回')}</div>
                <div class="expected">期望：${escapeHtml(row.期望值 || '未设置')}</div>
                <div class="desc">${escapeHtml(row.中文说明 || '')}</div>
                <div class="advice">${escapeHtml(row.修复建议 || '无需处理')}</div>
                ${row.可自动修复 ? `<button class="btn-primary fix-btn" type="button" data-fix-id="${escapeHtml(row.id)}">立即修复</button>` : ''}
            </article>
        `).join('');
        document.querySelectorAll('[data-fix-id]').forEach(button => {
            button.onclick = () => fixItem(button.dataset.fixId);
        });
        const issues = Array.isArray(result.issues) ? result.issues : [];
        const hint = document.getElementById('hint');
        hint.style.display = '';
        hint.innerHTML = issues.length
            ? '<b>优先处理：</b><br>' + issues.map(escapeHtml).join('<br>')
            : '一切正常，可以直接开始。';
    }
    async function fixItem(id) {
        setBusy('正在修复环境项...');
        try {
            const res = await fetch('/api/env-check/fix', { method: 'POST', headers: headers(), body: JSON.stringify({ id }) });
            const body = await res.json();
            if (!res.ok || body.success === false) throw new Error(body.message || '修复失败');
            await loadEnv(false);
        } catch (e) {
            document.getElementById('loading').textContent = '修复失败：' + e.message;
        }
    }
    async function loadEnv(deep = false) {
        setBusy(deep ? '正在深度诊断，可能需要几十秒...' : '正在检查...');
        try {
            const res = await fetch('/api/env-check?deep=' + (deep ? '1' : '0'), { headers: headers() });
            const body = await res.json();
            if (!res.ok || body.success === false) throw new Error(body.message || '检查失败');
            render(body);
        } catch (e) {
            document.getElementById('loading').textContent = '检查失败：' + e.message;
        }
    }
    async function exportPackage() {
        setBusy('正在导出诊断包...');
        try {
            const res = await fetch('/api/diagnose/export', { method: 'POST', headers: headers(), body: JSON.stringify({ deep: true }) });
            const body = await res.json();
            if (!res.ok || body.success === false) throw new Error(body.message || '导出失败');
            render(body.result || body);
            const hint = document.getElementById('hint');
            hint.innerHTML = '<b>诊断包已导出：</b><br><code>' + escapeHtml(body.packagePath || body.folder) + '</code>';
        } catch (e) {
            document.getElementById('loading').textContent = '导出失败：' + e.message;
        }
    }
    document.getElementById('refreshBtn').onclick = () => loadEnv(false);
    document.getElementById('deepBtn').onclick = () => loadEnv(true);
    document.getElementById('exportBtn').onclick = exportPackage;
    loadEnv(false);
    </script>
</body>
</html>
